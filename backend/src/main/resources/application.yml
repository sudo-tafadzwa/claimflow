spring:
  application:
    name: claimflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5460/claimflow}
    username: ${DB_USER:claimflow}
    password: ${DB_PASSWORD:claimflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/claimflow}

camunda:
  client:
    mode: self-managed
    grpc-address: ${ZEEBE_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${ZEEBE_REST_ADDRESS:http://localhost:8088}
    worker:
      defaults:
        max-jobs-active: 16

claimflow:
  extraction:
    provider: ${EXTRACTION_PROVIDER:fake}
    confidence-threshold: ${EXTRACTION_CONFIDENCE_THRESHOLD:0.85}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
      timeout: 30s
  ledger:
    # Payouts above this amount are rejected by the (mock) ledger, which triggers compensation.
    reject-above: ${LEDGER_REJECT_ABOVE:1000000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
