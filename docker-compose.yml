# ClaimFlow demo stack: Camunda 8.8 (Zeebe + Operate + Tasklist on Elasticsearch), Keycloak, Postgres,
# the Spring Boot API and the Next.js web app. For local use and demos, not production (see docs/adr/0006).
#
#   cp .env.example .env
#   docker compose up -d --build
#
#   Web app     http://localhost:3000     (users in docs/demo-users.md, password "demo")
#   API docs    http://localhost:8080/swagger-ui.html
#   Operate     http://localhost:8088/operate   (demo / demo)
#   Keycloak    http://localhost:8180     (admin / admin)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimflow
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claimflow}
    ports: ["5460:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimflow"]
      interval: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens carry this issuer whether they were requested by the browser or inside the network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8180"]
    volumes:
      - ./infra/keycloak/claimflow-realm.json:/opt/keycloak/data/import/claimflow-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 60

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes: [elastic:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cat/health | grep -qE 'green|yellow'"]
      interval: 2s
      retries: 60

  orchestration:
    image: camunda/camunda:8.8.40
    ports: ["26510:26500", "8088:8080"]  # 26510 on the host avoids clashing with a local Zeebe
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    volumes: [camunda:/usr/local/camunda/data]
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 3s
      retries: 60
      start_period: 30s

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/claimflow
      DB_USER: claimflow
      DB_PASSWORD: ${DB_PASSWORD:-claimflow}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/claimflow
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/claimflow/protocol/openid-connect/certs
      ZEEBE_GRPC_ADDRESS: http://orchestration:26500
      ZEEBE_REST_ADDRESS: http://orchestration:8080
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      LEDGER_REJECT_ABOVE: ${LEDGER_REJECT_ABOVE:-50000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_FORMAT: ecs
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      orchestration: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_OIDC_AUTHORITY: http://localhost:8180/realms/claimflow
        NEXT_PUBLIC_OIDC_CLIENT_ID: claimflow-web
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres:
  elastic:
  camunda:

configs:
  orchestration-config:
    content: |
      camunda:
        security:
          authentication:
            method: basic
            unprotectedApi: true
          authorizations:
            enabled: false
          initialization:
            users:
              - username: demo
                password: demo
                name: Demo User
                email: demo@example.com
            defaultRoles.admin.users:
              - demo
        database.index.numberOfReplicas: 0
        data:
          secondary-storage:
            type: elasticsearch
            elasticsearch:
              cluster-name: elasticsearch
              url: http://elasticsearch:9200
